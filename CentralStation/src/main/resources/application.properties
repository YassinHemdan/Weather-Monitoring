# KAFKA
kafka.enabled=true
kafka.topic=weather-events-topic
bootstrap.servers=127.0.0.1:29092
group.id=central-station
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.example.adapter.inbond.kafka.deserializer.WeatherDeserializer
enable.auto.commit=false
auto.offset.reset=earliest


#TCP
tcp.port=6380
tcp.backlog=128
tcp.max-concurrent-clients=128
tcp.graceful-shutdown-seconds=5


#DB
bitcask.data-dir=./data/bitcask